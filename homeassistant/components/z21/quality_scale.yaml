rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: done
    comment: Integration uses local_push with UDP subscription callbacks.
  brands:
    status: exempt
    comment: Brand assets to be added separately.
  common-modules:
    status: done
    comment: Uses entity.py for base entity class, models.py for data models.
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: Uses z21aio library which is async and has no external dependencies.
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-high-level-description:
    status: exempt
    comment: Documentation to be added in a separate PR.
  docs-installation-instructions:
    status: exempt
    comment: Documentation to be added in a separate PR.
  docs-removal-instructions:
    status: exempt
    comment: Documentation to be added in a separate PR.
  entity-event-setup:
    status: done
    comment: Entities subscribe to dispatcher signals in async_added_to_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register custom actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Integration does not require authentication.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: Integration does not support network discovery.
  discovery:
    status: exempt
    comment: Z21 stations do not advertise on the network.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: todo
  entity-device-class:
    status: exempt
    comment: Fan and switch entities do not have applicable device classes.
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: Integration does not create repair issues.
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Integration uses UDP, not HTTP.
  strict-typing: todo
